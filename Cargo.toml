[workspace]
resolver = "3"
members = ["crates/mvl-core", "crates/mvl-audio", "crates/mvl-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["salim77007j"]
repository = "https://github.com/salim77007j/voi55"
homepage = "https://github.com/salim77007j/voi55"

[workspace.dependencies]
# Audio I/O
cpal = "0.18"
# File containers / codecs
hound = "3.5"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
mp3lame-encoder = "0.2"
# DSP primitives (D6)
realfft = "3"
rustfft = "6"
# Utilities
thiserror = "2"
log = "0.4"
# UI (D1: Slint — RTL/Arabic first-class, declarative, no webview)
slint = { version = "1.18", features = ["renderer-software"] }
slint-build = "1.18"
# PNG encoding for the headless screenshot mode (evidence pipeline, D14)
png = "0.18"
# Native file dialogs (xdg-portal on Linux: no C toolkit dep; native APIs
# on Windows/macOS). See D15 mvl-app responsibilities.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep third-party DSP (rustfft SIMD etc.) fast under `cargo test` while our
# own crates stay at opt-level 0 for debuggability. Deps get no debug info
# (slint/rustfft debug info alone is gigabytes).
[profile.dev.package."*"]
opt-level = 2
debug = false
strip = "debuginfo"
