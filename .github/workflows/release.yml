name: Release artifacts

# D15: release artifacts uploaded per platform. Builds the stripped release
# binary on all three targets, verifies it actually runs (headless render),
# enforces the < 50 MB binary budget from the brief, and bundles
# binary + README + LICENSE (GPL-3.0 §4 requires the license copy).
#
# Runs on version tags (bundles are attached to a GitHub Release) and on
# workflow_dispatch (artifact-only verification runs).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating the GitHub Release needs write access to contents (the default
# GITHUB_TOKEN is read-only for the REST API — "Resource not accessible by
# integration" without this block).
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: tar.gz
            binary: micro-vocal-lab
          - os: windows-latest
            bundle: zip
            binary: micro-vocal-lab.exe
          - os: macos-latest
            bundle: tar.gz
            binary: micro-vocal-lab
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA + fontconfig headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p mvl-app

      # macOS ships a universal binary (arm64 + x86_64) so both Apple
      # Silicon and Intel Macs run the same artifact; the smoke/size steps
      # below then exercise the native slice. lipo output is re-signed
      # ad-hoc (the linker-produced signature does not survive lipo).
      - name: Build universal macOS binary (arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release -p mvl-app --target x86_64-apple-darwin
          lipo -create \
            "target/release/${{ matrix.binary }}" \
            "target/x86_64-apple-darwin/release/${{ matrix.binary }}" \
            -output "target/release/${{ matrix.binary }}"
          lipo -info "target/release/${{ matrix.binary }}"
          codesign --force -s - "target/release/${{ matrix.binary }}"

      # Gate: the shipped artifact must run, not just link — renders a real
      # frame through the headless software renderer.
      - name: Run the release binary (headless render)
        shell: bash
        run: |
          target/release/${{ matrix.binary }} --screenshot --demo synth \
            --out smoke-${{ matrix.os }}.png
          test -s smoke-${{ matrix.os }}.png

      - name: Binary size gate (< 50 MB)
        shell: bash
        run: |
          f="target/release/${{ matrix.binary }}"
          bytes=$(wc -c < "$f")
          echo "release binary: ${bytes} bytes"
          limit=$((50 * 1024 * 1024))
          if [ "$bytes" -ge "$limit" ]; then
            echo "FAILED: ${bytes} bytes >= ${limit} bytes (budget: < 50 MB)"
            exit 1
          fi

      # Linux: plain tarball with the binary (CLI-first platform).
      - name: Bundle (binary + README + LICENSE)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="micro-vocal-lab-${{ matrix.os }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.binary }}" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      # macOS: a real .app bundle — Info.plist carries NSMicrophoneUsage-
      # Description (CoreAudio's capture prompt reads it; without it an
      # unsigned build's capture can be silently denied) plus the version
      # taken from the workspace manifest. The raw binary ships alongside
      # for terminal users; the bundle is ad-hoc signed (NOT a Developer ID
      # signature — Gatekeeper still requires right-click-open, documented
      # in the report).
      - name: Bundle macOS (.app + raw binary + README + LICENSE)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "bundle version: ${version}"
          dir="micro-vocal-lab-${{ matrix.os }}"
          app="Micro-Vocal Lab.app"
          mkdir -p "$app/Contents/MacOS"
          sed "s/@APP_VERSION@/${version}/" .github/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp "target/release/${{ matrix.binary }}" "$app/Contents/MacOS/micro-vocal-lab"
          codesign --force -s - "$app"
          mkdir "$dir"
          cp -R "$app" "$dir/"
          cp "target/release/${{ matrix.binary }}" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      # windows-latest runners ship no `zip`; PowerShell's Compress-Archive
      # produces the same artifact without extra dependencies.
      - name: Bundle (binary + README + LICENSE)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "micro-vocal-lab-${{ matrix.os }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $dir/
          Copy-Item README.md $dir/
          Copy-Item LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: micro-vocal-lab-${{ matrix.os }}
          path: micro-vocal-lab-${{ matrix.os }}.${{ matrix.bundle }}
          if-no-files-found: error

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.os }}
          path: smoke-${{ matrix.os }}.png
          if-no-files-found: error

  github-release:
    # Attach bundles to the tag's GitHub Release (dispatch runs skip this).
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/micro-vocal-lab-*.tar.gz
            dist/micro-vocal-lab-*.zip
